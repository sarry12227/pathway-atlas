[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pathway-atlas"
version = "0.1.7"
description = "Step-by-step college planning: compare schools, majors and pathways with evidence and clear next steps"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
documents = ["python-docx>=1.1,<2"]
spreadsheets = ["openpyxl>=3.1,<4", "xlrd>=2,<3"]
pdf = ["pdfplumber>=0.11,<1", "pypdf>=4,<7"]
test = [
    "coverage>=7,<8",
    "PyYAML>=6,<7",
    "tomli>=2,<3; python_version < '3.11'",
]
all = [
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "pdfplumber>=0.11,<1",
    "pypdf>=4,<7",
]

[tool.setuptools.packages.find]
include = ["scripts*"]
