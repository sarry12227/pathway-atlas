      <use href="#route-loop" stroke="#94070A" transform="rotate(72 256 256)"/>
      <use href="#route-loop" stroke="#94070A" transform="rotate(144 256 256)"/>
      <use href="#route-loop" stroke="#14213D" transform="rotate(216 256 256)"/>
      <use href="#route-loop" stroke="#94070A" transform="rotate(288 256 256)"/>
