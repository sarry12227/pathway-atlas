<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">多元星途 PathwayAtlas</title>
  <desc id="desc">点亮多种升学路径，走出个性升学星途。</desc>
  <defs>
    <path id="star-shape" d="M0-36 10-11 36 0 10 11 0 36-10 11-36 0-10-11Z"/>
  </defs>

  <g transform="translate(16 -3) scale(.9)">
    <g id="path-origin" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 438C91 374 154 360 198 305C237 256 216 204 250 132" stroke="#94070A"/>
      <path d="M150 450C150 384 190 350 231 312C270 276 292 220 256 132" stroke="#14213D"/>
      <path d="M256 456C271 391 220 352 225 302C231 247 258 207 258 132" stroke="#94070A"/>
      <path d="M362 450C361 382 323 349 282 309C244 272 222 220 260 132" stroke="#14213D"/>
      <path d="M442 438C420 374 357 360 313 305C273 256 298 204 266 132" stroke="#94070A"/>
    </g>
    <g id="evidence-node" fill="#FFF8E7" stroke="#C9A227" stroke-width="8">
      <circle cx="158" cy="358" r="12"/>
      <circle cx="225" cy="302" r="12"/>
      <circle cx="258" cy="205" r="12"/>
      <circle cx="283" cy="309" r="12"/>
      <circle cx="354" cy="358" r="12"/>
    </g>
    <g id="guiding-star">
      <path d="M258 132V111" fill="none" stroke="#C9A227" stroke-width="8" stroke-linecap="round"/>
      <use href="#star-shape" fill="#C9A227" transform="translate(258 76)"/>
      <circle cx="258" cy="76" r="8" fill="#FFF8E7"/>
    </g>
  </g>

  <g font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif">
    <text x="505" y="178" fill="#94070A" font-size="106" font-weight="750" letter-spacing="7">多元星途</text>
    <text x="511" y="254" fill="#14213D" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="52" font-weight="650" letter-spacing="1.5">PathwayAtlas</text>
    <line x1="511" y1="292" x2="1345" y2="292" stroke="#C9A227" stroke-width="4"/>
    <text x="511" y="348" fill="#14213D" font-size="29" font-weight="450" letter-spacing="1.8">点亮多种升学路径，走出个性升学星途。</text>
  </g>
