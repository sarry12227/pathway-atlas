<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">多元星图品牌标志</title>
  <desc id="desc">五条证据路径围绕学生目标星汇聚成一幅开放的升学星图</desc>
  <defs>
    <path id="route-star" d="M0-22 6-7 22 0 6 7 0 22-6 7-22 0-6-7Z"/>
    <path id="route-loop" d="M256 256C202 204 208 112 256 62c48 50 54 142 0 194Z"/>
  </defs>

  <!-- 五条闭合轨道：选择彼此独立，又围绕同一学生目标。 -->
  <g fill="none" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <use href="#route-loop" stroke="#14213D"/>
    <use href="#route-loop" stroke="#94070A" transform="rotate(72 256 256)"/>
    <use href="#route-loop" stroke="#94070A" transform="rotate(144 256 256)"/>
    <use href="#route-loop" stroke="#14213D" transform="rotate(216 256 256)"/>
    <use href="#route-loop" stroke="#94070A" transform="rotate(288 256 256)"/>
  </g>

  <!-- 路径上的金色节点代表可核验的证据锚点。 -->
  <g fill="#C9A227">
    <circle cx="229" cy="158" r="7"/>
    <circle cx="229" cy="158" r="7" transform="rotate(72 256 256)"/>
    <circle cx="229" cy="158" r="7" transform="rotate(144 256 256)"/>
    <circle cx="229" cy="158" r="7" transform="rotate(216 256 256)"/>
    <circle cx="229" cy="158" r="7" transform="rotate(288 256 256)"/>
  </g>

  <!-- 外星点是不同升学路径；中心星是学生自己的目标。 -->
  <g fill="#94070A">
      <use href="#route-star" transform="rotate(72 256 256) translate(256 62) scale(.72)"/>
      <use href="#route-star" transform="rotate(144 256 256) translate(256 62) scale(.72)"/>
      <use href="#route-star" transform="rotate(288 256 256) translate(256 62) scale(.72)"/>
  </g>
  <g fill="#14213D">
      <use href="#route-star" transform="translate(256 62) scale(.72)"/>
      <use href="#route-star" transform="rotate(216 256 256) translate(256 62) scale(.72)"/>
  </g>
  <use href="#route-star" fill="#C9A227" transform="translate(256 258) scale(1.18)"/>
  <circle cx="256" cy="258" r="5" fill="#FFF8E7"/>
</svg>
