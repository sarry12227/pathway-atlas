name: Publish tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish deterministic artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete tagged history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install all test dependencies
        run: python -m pip install -e ".[all,test]"
      - name: Read the exact project version
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          payload = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = payload["project"]["version"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Verify one annotated tag at the checked-out commit
        shell: bash
        run: |
          version="${{ steps.metadata.outputs.version }}"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Run the complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Run the strict tagged release gate
        run: python scripts/release_check.py --ci --expected-version "${{ steps.metadata.outputs.version }}" --tag "${{ github.ref_name }}"
      - name: Build the deterministic release pair
        run: python scripts/build_release.py --version "${{ steps.metadata.outputs.version }}" --output dist
      - name: Verify the published checksum input
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Extract exactly one matching changelog section
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = "${{ steps.metadata.outputs.version }}"
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = f"## v{version} — "
          matches = [index for index, line in enumerate(lines) if line.startswith(heading)]
          if len(matches) != 1:
              raise SystemExit("matching changelog section is not unique")
          start = matches[0]
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit("matching changelog section is empty")
          Path("dist/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Publish the non-draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/shengxue-skill-${{ steps.metadata.outputs.version }}.zip" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
