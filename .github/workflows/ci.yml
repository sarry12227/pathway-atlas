name: Deterministic CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: deterministic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install all test dependencies
        run: python -m pip install -e ".[all,test]"
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic 3+1+2 fixture
        run: python scripts/validate_data.py tests/fixtures/provinces/demo-312
      - name: Validate synthetic 3+3 fixture
        run: python scripts/validate_data.py tests/fixtures/provinces/demo-33
      - name: Validate committed evidence fixture
        run: python scripts/validate_evidence.py tests/fixtures/evidence/three-source-consensus
      - name: Scan tracked repository content
        run: python scripts/compliance_scan.py --tracked
      - name: Run final release gate
        run: python scripts/release_check.py --ci --expected-version 0.1.0
