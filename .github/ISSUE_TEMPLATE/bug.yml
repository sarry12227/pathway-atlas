name: "功能缺陷报告"
description: "报告可复现的功能错误，请只使用虚构或匿名化的最小样例。"
title: "[缺陷] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告缺陷。这里只接收不含个人信息的公开问题；不要填写或附加学生真实姓名、手机号、身份证号、精确住址、私人报告或其他受限材料。

        安全漏洞不得在公开 Issue 披露，请改按[安全政策](../../SECURITY.md)使用私密报告渠道。
  - type: textarea
    id: summary
    attributes:
      label: "问题摘要"
      description: "请用匿名、简短的文字说明发生了什么；不要粘贴报告或截图。"
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: "最小复现步骤"
      description: "请使用虚构输入列出可重复的步骤，不要包含真实学生案例或附件。"
      render: text
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "预期行为"
      description: "请说明按照公开文档或接口契约，系统应当产生什么结果。"
      render: text
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: "实际行为"
      description: "请说明匿名化后的实际结果；只粘贴最小错误片段，不要附加文件。"
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "运行环境"
      description: "请填写 PathwayAtlas 版本、操作系统和 Python 版本，不要填写本地绝对路径。"
      placeholder: "例如：v0.1.0、Windows、Python 3.10"
    validations:
      required: true
  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: "公开信息确认"
      description: "提交前请确认公开内容满足隐私和安全边界。"
      options:
        - label: "我确认没有填写或附加学生真实姓名、手机号、身份证号、精确住址、私人报告或其他个人信息。"
          required: true
        - label: "我确认这不是需要按安全政策私密报告的漏洞。"
          required: true
    validations:
      required: true
